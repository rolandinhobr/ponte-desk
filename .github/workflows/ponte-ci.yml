name: Ponte Desk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test native core
        run: cargo test --no-default-features -p ponte-desk -p input-capture -p input-emulation -j 1
      - name: Lint
        run: cargo clippy --no-default-features --all-targets -j 1 -- -D warnings -A clippy::double_must_use
      - name: Build core
        run: cargo build --release --no-default-features -j 1
      - name: Compile macOS interface
        if: runner.os == 'macOS'
        run: swiftc -warnings-as-errors -emit-library -O native/macos/PonteDesk.swift native/macos/PonteInterface.swift native/macos/PonteArtwork.swift native/macos/PonteSettings.swift native/macos/CameraComponent.swift native/macos/WebcamCapture.swift native/macos/WebcamSink.swift -o /tmp/PonteDeskUI.dylib -framework AppKit -framework ApplicationServices -framework AVFoundation -framework VideoToolbox -framework CoreMediaIO -framework CoreMedia -framework CoreVideo -framework ImageIO
      - name: Coordinator smoke test
        if: runner.os == 'macOS'
        run: python3 tests/coordinator_smoke.py target/release/ponte-desk
      - name: Build Windows camera
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/windows/webcam/build.ps1
